name: ci

on:
  push:
  pull_request:

jobs:
  phase-zero-contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.6.3"
      - run: uv python install 3.11.9
      - run: uv sync --all-extras --frozen
      - run: uv run ruff check .
      - run: uv run mypy src scripts
      - run: uv run pytest -q
