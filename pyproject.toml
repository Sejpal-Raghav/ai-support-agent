[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "hiver-support-agent"
version = "0.1.0"
description = "Auditable selective-prediction support-agent prototype for the Hiver SDE Intern take-home."
readme = "README.md"
requires-python = "==3.11.*"
license = { text = "MIT" }
authors = [{ name = "Candidate" }]
dependencies = [
  "numpy==1.26.4",
  "pandas==2.2.3",
  "scipy==1.14.1",
  "scikit-learn==1.6.1",
  "pydantic==2.10.6",
  "pydantic-settings==2.7.1",
  "PyYAML==6.0.2",
  "typer==0.15.1",
  "click==8.1.8",
  "matplotlib==3.10.0",
  "seaborn==0.13.2",
  "joblib==1.4.2",
]

[project.optional-dependencies]
eval = []
compact = [
  "onnxruntime==1.20.1",
  "tokenizers==0.21.4",
]
data = [
  "pyarrow==19.0.0",
  "duckdb==1.2.0",
  "kaggle==1.6.17",
  "kagglehub==0.3.13",
  "langdetect==1.0.9",
]
ml = [
  "torch==2.6.0",
  "transformers==4.48.3",
  "accelerate==1.3.0",
  "sentencepiece==0.2.0",
  "sentence-transformers==3.4.1",
  "huggingface-hub==0.28.1",
  "faiss-cpu==1.10.0",
  "umap-learn==0.5.7",
  "hdbscan==0.8.40",
]
api = [
  "fastapi==0.115.8",
  "imageio-ffmpeg==0.6.0",
  "python-multipart==0.0.20",
  "uvicorn==0.34.0",
  "vosk==0.3.45",
]
dev = [
  "httpx==0.28.1",
  "pytest==8.3.4",
  "pytest-cov==6.0.0",
  "ruff==0.9.5",
  "mypy==1.14.1",
  "pandas-stubs==2.2.3.241126",
  "types-PyYAML==6.0.12.20241230",
]

[tool.hatch.build.targets.wheel]
packages = ["src/support_agent"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# Typer declares CLI options through evaluated defaults by design.
ignore = ["B008"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["support_agent"]
mypy_path = "src"
warn_unused_configs = true

[[tool.mypy.overrides]]
module = [
  "imageio_ffmpeg", "kagglehub", "onnxruntime", "scipy.*", "sklearn.*",
  "tokenizers", "transformers", "vosk",
]
ignore_missing_imports = true

[tool.uv]
default-groups = []
